# Marl Review on its own pull requests. Without the MARL_API_KEY secret the action skips with a notice.
name: Marl Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./
        with:
          token: ${{ secrets.MARL_API_KEY }}
